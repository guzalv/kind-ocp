version: 1
name: greenfield
description: >-
  Deliver a software project from scratch in gated increments. po turns the
  objective into testable acceptance criteria and non-goals. dev writes
  docs/PLAN.md (architecture plus an ordered increment checklist) on the first
  pass, then implements exactly one unchecked increment per pass, checks it
  off, and commits. Each increment is gated by acceptance testing, code review,
  and security review. conductor routes the loop: next unchecked increment, or
  done. Nothing completes until all gates approve.

entry: scope

limits:
  max_steps: 60
  timeout_seconds: 57600
  node_timeout_seconds: 10800
  max_result_retries: 2
  max_recovery_attempts: 3
  max_repeat_transitions: 8

nodes:
  scope:
    agent: po
    routes:
      ready: implement
      blocked: pause

  implement:
    agent: dev
    routes:
      ready: verify
      blocked: pause

  verify:
    agent: tester
    routes:
      passed: review
      failed: implement
      blocked: pause

  review:
    agent: reviewer
    routes:
      approved: security
      changes_requested: implement
      blocked: pause

  security:
    agent: security
    routes:
      approved: triage
      changes_requested: implement
      blocked: pause

  triage:
    agent: conductor
    routes:
      next: implement
      done: complete
      blocked: pause
