# The three config.openshift.io singletons the placeholder CRDs above serve:
# APIServer/cluster, Infrastructure/cluster, and ClusterVersion/version.
# Ported verbatim from stackrox PR #23841
# (tests/e2e/kind-compliance/assets/openshift-shim/config-objects.yaml).
# The Infrastructure status is written separately by the config-openshift
# layer through the status subresource; spec-only here.
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
spec: {}
---
apiVersion: config.openshift.io/v1
kind: Infrastructure
metadata:
  name: cluster
spec:
  platformSpec:
    type: None
---
apiVersion: config.openshift.io/v1
kind: ClusterVersion
metadata:
  name: version
spec:
  clusterID: "00000000-0000-0000-0000-000000000000"
