# kind-ocp consumer action: delete (docs/PLAN.md §8). Deletes the
# kind-ocp clusters of one prefix and its per-prefix state directory.
# Self-sufficient — it installs the pinned kind-ocp release itself —
# so it works under `if: always()` even when the create action failed
# during its own setup. Idempotent: absent clusters and absent state
# are not errors, so a re-run continues where a stopped one left off.
#
# Security posture: same as the create action (no `${{ }}` in `run:`,
# `euo pipefail`, quoted expansions, ambient KIND_OCP_* neutralized)
# plus the same single-line rule for the inputs a tool echoes
# verbatim: kind-ocp prints the state root unquoted (`state
# cleared under <root>`) and os errors carry paths verbatim, and
# go renders the module@version operand unquoted, so a multiline
# value would put its later lines at line starts in the step log,
# where the runner parses `::` workflow commands. Refused with
# fixed messages, never echoed.
#
# STAGED FILE — this is the complete action, byte-for-byte, but it
# does not live at its operative path yet: the automated sessions
# that develop this repo run under a sandbox that refuses writes to
# `.github/` (a protected configuration path there), and evading
# that refusal is not an option. Move it into place from a normal
# (non-automated) session, following action/MOVE.md:
#
#   mkdir -p .github/actions
#   git mv action/delete .github/actions/delete
#
# — and delete this paragraph.
name: 'kind-ocp delete'
description: >-
  Delete the kind-ocp clusters of one prefix and its state root.
  Self-sufficient and idempotent; designed for `if: always()`.

inputs:
  prefix:
    description: >-
      Cluster name prefix to delete (every <prefix>-<i> cluster and
      the per-prefix state directory). Required. Must be a single
      line (CR/LF refused).
    required: true
  state_root:
    description: >-
      kind-ocp state root the create action used. Empty derives
      <RUNNER_TEMP>/kind-ocp, the create action's default; pass
      create's state_root output whenever create used a custom one.
      Must be a single line (CR/LF refused).
    default: ''
  kind_ocp_version:
    description: >-
      Released kind-ocp version the action installs with go install.
      Keep aligned with the create action's input (the defaults
      are). Must be a single line (CR/LF refused).
    default: 'v0.1.1'
  go_version:
    description: >-
      Go toolchain for the install; must satisfy the pinned release's
      go.mod minimum.
    default: '1.27.4'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go_version }}
        # See the create action: caching against the caller's go.sum is
        # pointless here, and the caller need not be a Go project.
        cache: false

    - name: Install kind-ocp
      env:
        INPUT_KIND_OCP_VERSION: ${{ inputs.kind_ocp_version }}
      shell: bash
      run: |
        set -euo pipefail
        # See the create action's install step: go renders the
        # module@version operand unquoted in its own diagnostics,
        # so a multiline kind_ocp_version must be refused before it
        # can reach them. Never echo it.
        case "${INPUT_KIND_OCP_VERSION:-}" in
          *$'\r'*|*$'\n'*)
            echo "kind_ocp_version must be a single line (no CR or LF)" >&2
            exit 1 ;;
        esac
        # See the create action: GOBIN pinned to a runner-local
        # directory, and that same directory published below, so an
        # ambient GOBIN cannot decide where the binary lands.
        install_dir="${RUNNER_TEMP:?RUNNER_TEMP is not set}/kind-ocp-bin"
        mkdir -p "$install_dir"
        GOBIN="$install_dir" go install "github.com/guzalv/kind-ocp/cmd/kind-ocp@${INPUT_KIND_OCP_VERSION:?kind_ocp_version input is empty}"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

    - name: Delete the clusters
      env:
        # Composite run steps get no automatic INPUT_* variables; the
        # env mapping is the wiring that carries each input in.
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_STATE_ROOT: ${{ inputs.state_root }}
      shell: bash
      run: |
        set -euo pipefail
        unset KIND_OCP_CONFIG KIND_OCP_PREFIX KIND_OCP_COUNT KIND_OCP_PROFILE
        # Same default the create action derives, so a same-job
        # delete cleans up a default-scope create.
        state_root="${INPUT_STATE_ROOT:-${RUNNER_TEMP:?RUNNER_TEMP is not set}/kind-ocp}"
        # kind-ocp prints the state root unquoted (`state cleared
        # under <root>`) and os errors carry paths verbatim, and the
        # prefix guard mirrors the create action: a multiline value
        # would put its later lines at line starts in this step's
        # log — where the runner parses `::` workflow commands.
        # Refuse the shapes; never echo them.
        case "${INPUT_PREFIX:-}" in
          *$'\r'*|*$'\n'*)
            echo "prefix must be a single line (no CR or LF)" >&2
            exit 1 ;;
        esac
        case "$state_root" in
          *$'\r'*|*$'\n'*)
            echo "state_root must be a single line (no CR or LF)" >&2
            exit 1 ;;
        esac
        # --config '' pins the lookup off: cleanup must not depend on
        # whatever KIND_OCP_CONFIG the calling workflow carries.
        kind-ocp delete --config '' --prefix "${INPUT_PREFIX:?prefix input is required}" --state-root "$state_root"
