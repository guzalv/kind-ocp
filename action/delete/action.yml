# kind-ocp consumer action: delete (docs/PLAN.md §8). Deletes the
# kind-ocp clusters of one prefix and its per-prefix state directory.
# Self-sufficient — it installs the pinned kind-ocp release itself —
# so it works under `if: always()` even when the create action failed
# during its own setup. Idempotent: absent clusters and absent state
# are not errors, so a re-run continues where a stopped one left off.
#
# Security posture: same as the create action (no `${{ }}` in
# `run:`, `euo pipefail`, quoted expansions, ambient KIND_OCP_*
# neutralized, shared helpers sourced from ACTION_LIB), plus:
#   - Inputs are validated once, in the first run step, before any
#     tool or third-party action runs: the prefix and state root
#     are refused unless single-line (kind-ocp prints the state
#     root unquoted — `state cleared under <root>` — and os errors
#     carry paths verbatim), and go_version / kind_ocp_version are
#     held to the version-token charset (setup-go logs the spec
#     verbatim in its own step; go renders the module@version
#     operand unquoted). Fixed messages, never the raw value.
#   - Tool diagnostics are inert in the runner's log whatever they
#     quote: the runner parses workflow commands in two formats
#     (modern `::name::` at a trimmed line start, legacy `##[name]`
#     anywhere on a line — neither comparison is byte-wise), so
#     every kind-ocp and go byte bound for the log passes lib.sh's
#     ko_neutralize_log (every `#` backslash-escaped, every line
#     given a fixed visible prefix), with tool exit statuses
#     preserved.
#
# STAGED FILE — this is the complete action, byte-for-byte, but it
# does not live at its operative path yet: the automated sessions
# that develop this repo run under a sandbox that refuses writes to
# `.github/` (a protected configuration path there), and evading
# that refusal is not an option. Move it into place from a normal
# (non-automated) session, following action/MOVE.md:
#
#   mkdir -p .github/actions
#   git mv action/delete .github/actions/delete
#   git mv action/lib.sh .github/actions/lib.sh
#
# — and delete this paragraph.
name: 'kind-ocp delete'
description: >-
  Delete the kind-ocp clusters of one prefix and its state root.
  Self-sufficient and idempotent; designed for `if: always()`.

inputs:
  prefix:
    description: >-
      Cluster name prefix to delete (every <prefix>-<i> cluster and
      the per-prefix state directory). Required. Must be a single
      line (CR/LF refused).
    required: true
  state_root:
    description: >-
      kind-ocp state root the create action used. Empty derives
      <RUNNER_TEMP>/kind-ocp, the create action's default; pass
      create's state_root output whenever create used a custom one.
      Must be a single line (CR/LF refused).
    default: ''
  kind_ocp_version:
    description: >-
      Released kind-ocp version the action installs with go install.
      Keep aligned with the create action's input (the defaults
      are). Must be a single token of letters, digits, and
      . _ ~ ^ + < > / = - (CR/LF and every workflow-command byte
      refused).
    default: 'v0.1.1'
  go_version:
    description: >-
      Go toolchain for the install; must satisfy the pinned release's
      go.mod minimum. Same single-token rule as kind_ocp_version:
      setup-go logs the spec verbatim in its own step.
    default: '1.27.4'

runs:
  using: composite
  steps:
    - name: Validate the inputs
      env:
        # Composite run steps get no automatic INPUT_* variables;
        # the env mapping is the wiring that carries each input in.
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_STATE_ROOT: ${{ inputs.state_root }}
        INPUT_KIND_OCP_VERSION: ${{ inputs.kind_ocp_version }}
        INPUT_GO_VERSION: ${{ inputs.go_version }}
        ACTION_LIB: ${{ github.action_path }}/../lib.sh
      shell: bash
      run: |
        set -euo pipefail
        source "${ACTION_LIB:?ACTION_LIB is not set}"
        # The single validation point (review round 6): what the
        # delete step used to check inline is refused here, ahead
        # of every tool and third-party action. The state-root
        # check covers the caller's input; the default derived
        # below is runner-controlled and safe by construction.
        ko_require_single_line prefix "${INPUT_PREFIX:-}"
        ko_require_single_line state_root "${INPUT_STATE_ROOT:-}"
        ko_require_version_token go_version "${INPUT_GO_VERSION:?go_version input is empty}"
        ko_require_version_token kind_ocp_version "${INPUT_KIND_OCP_VERSION:?kind_ocp_version input is empty}"

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go_version }}
        # See the create action: caching against the caller's go.sum is
        # pointless here, and the caller need not be a Go project.
        cache: false

    - name: Install kind-ocp
      env:
        INPUT_KIND_OCP_VERSION: ${{ inputs.kind_ocp_version }}
        ACTION_LIB: ${{ github.action_path }}/../lib.sh
      shell: bash
      run: |
        set -euo pipefail
        source "${ACTION_LIB:?ACTION_LIB is not set}"
        # See the create action: GOBIN pinned to a runner-local
        # directory, and that same directory published below, so an
        # ambient GOBIN cannot decide where the binary lands. go's
        # diagnostics reach the log only through the sanitizer;
        # go's exit status is ko_run_tool's return value.
        install_dir="${RUNNER_TEMP:?RUNNER_TEMP is not set}/kind-ocp-bin"
        mkdir -p "$install_dir"
        ko_run_tool env GOBIN="$install_dir" go install "github.com/guzalv/kind-ocp/cmd/kind-ocp@${INPUT_KIND_OCP_VERSION:?kind_ocp_version input is empty}"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

    - name: Delete the clusters
      env:
        # Composite run steps get no automatic INPUT_* variables; the
        # env mapping is the wiring that carries each input in.
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_STATE_ROOT: ${{ inputs.state_root }}
        ACTION_LIB: ${{ github.action_path }}/../lib.sh
      shell: bash
      run: |
        set -euo pipefail
        source "${ACTION_LIB:?ACTION_LIB is not set}"
        unset KIND_OCP_CONFIG KIND_OCP_PREFIX KIND_OCP_COUNT KIND_OCP_PROFILE
        # Same default the create action derives, so a same-job
        # delete cleans up a default-scope create.
        state_root="${INPUT_STATE_ROOT:-${RUNNER_TEMP:?RUNNER_TEMP is not set}/kind-ocp}"
        # --config '' pins the lookup off: cleanup must not depend on
        # whatever KIND_OCP_CONFIG the calling workflow carries.
        # kind-ocp's diagnostics (the raw state root, paths in os
        # errors) reach the log only through the sanitizer; its exit
        # status is preserved (absent clusters and state are not
        # errors — kind-ocp's own idempotency).
        ko_run_tool kind-ocp delete --config '' --prefix "${INPUT_PREFIX:?prefix input is required}" --state-root "$state_root"
